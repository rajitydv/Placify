server.port=8080
spring.application.name=placify-tracker

# ===================================================================
# Database Configuration - MySQL (Default)
# ===================================================================
# Placify automatically creates the database 'placify_db' if it doesn't exist.
# Update the password below to match your local MySQL Server installation.
spring.datasource.url=jdbc:mysql://localhost:3306/placify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static web files location for frontend
spring.web.resources.static-locations=classpath:/static/
